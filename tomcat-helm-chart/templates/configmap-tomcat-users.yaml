apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tomcat-helm-chart.fullname" . }}-tomcat-users
  labels:
    {{- include "tomcat-helm-chart.labels" . | nindent 4 }}
data:
  tomcat-users.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <tomcat-users xmlns="http://tomcat.apache.org/xml"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://tomcat.apache.org/xml tomcat-users.xsd"
                  version="1.0">
      
      <role rolename="manager-gui"/>
      <role rolename="manager-script"/>
      <role rolename="manager-jmx"/>
      <role rolename="manager-status"/>
      <role rolename="admin-gui"/>
      <role rolename="admin-script"/>
      
      <user username="{{ .Values.tomcatUsers.username }}" 
            password="{{ .Values.tomcatUsers.password }}" 
            roles="{{ .Values.tomcatUsers.roles }}"/>
            
    </tomcat-users>